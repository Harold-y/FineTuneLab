schema_version: 1
method: sft
model:
  name_or_path: Qwen/Qwen3.5-4B
data:
  source: examples/data/sft.jsonl
  source_type: local
  modality: text
  max_length: 2048
tuning:
  strategy: lora
  lora_rank: 16
  lora_alpha: 32
training:
  output_dir: outputs/sft-4b-lora
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0001

