schema_version: 1
method: grpo
model:
  name_or_path: Qwen/Qwen3.5-4B
data:
  source: examples/data/prompts.jsonl
  source_type: local
  modality: text
  max_length: 1024
tuning:
  strategy: lora
training:
  output_dir: outputs/grpo-4b-lora
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00001
generation:
  max_new_tokens: 128
rewards:
  - name: numeric
num_generations: 2
beta: 0.04

