schema_version: 1
method: dapt
model:
  name_or_path: Qwen/Qwen3.5-4B-Base
data:
  source: examples/data/dapt.jsonl
  source_type: local
  modality: text
  max_length: 2048
  packing: true
tuning:
  strategy: selective
  selective_preset: last_n_text_layers
  last_n_layers: 4
training:
  output_dir: outputs/dapt-4b-selective
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00002

