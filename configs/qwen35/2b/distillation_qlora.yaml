schema_version: 1
method: distillation
model:
  name_or_path: Qwen/Qwen3.5-2B
  teacher_name_or_path: Qwen/Qwen3.5-4B
data:
  source: examples/data/prompts.jsonl
  source_type: local
  modality: text
  max_length: 1024
tuning:
  strategy: qlora
training:
  output_dir: outputs/distillation-4b-to-2b-qlora
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00001
generation:
  max_new_tokens: 128
beta: 1.0
teacher_temperature: 1.0

